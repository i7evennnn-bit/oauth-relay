<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Social Studio sign-in relay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui,sans-serif;max-width:34rem;margin:15vh auto;padding:0 1rem;color:#222}</style></head>
<body><h1>Returning to Social Studio…</h1><p id="m">One moment.</p>
<script>
// Static relay: the platform sends the browser here (https). We pass the same browser straight on
// to Social Studio on THIS computer (127.0.0.1). Nothing is stored or sent anywhere else.
(function () {
  var q = new URLSearchParams(location.search), state = q.get("state") || "";
  var port = parseInt(state.split(".")[0], 10);
  if (!(port >= 18700 && port <= 18999)) {
    document.getElementById("m").textContent = "This page only works when opened by Social Studio sign-in.";
    return;
  }
  location.replace("http://127.0.0.1:" + port + "/oauth/callback/relay" + location.search);
})();
</script></body></html>
